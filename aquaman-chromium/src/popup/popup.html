<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Aquaman</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="head">
      <img src="../../icons/icon48.png" alt="" width="36" height="36" />
      <div>
        <h1>Aquaman</h1>
        <p class="muted">Version <span id="version"></span></p>
      </div>
    </header>

    <section id="update" class="update" hidden>
      <p><b>Aquaman <span id="update-version"></span> est disponible.</b></p>
      <div class="row">
        <button type="button" id="update-go" class="btn main">Mettre à jour</button>
        <a href="#" id="update-notes" class="link">Voir les nouveautés</a>
      </div>
      <p id="update-help" class="help" hidden></p>
    </section>

    <section class="status">
      <p id="status" class="muted">…</p>
    </section>

    <nav class="actions">
      <button type="button" class="btn main" data-open="/jeu">Ouvrir le jeu</button>
      <button type="button" class="btn" data-open="/jeu#aqm-visite">Visite guidée</button>
      <button type="button" class="btn" data-open="/jeu#aqm-nouveautes">Nouveautés</button>
    </nav>

    <!-- The same settings as "Plus › Réglages" on the site (SETTINGS in src/lib/aquaman.js), filled by popup.js. -->
    <section class="settings" id="settings"></section>

    <footer class="foot">
      <a href="#" data-open="https://github.com/A-Finch13/Poseidon-TCG">GitHub</a>
      <span>·</span>
      <a href="#" data-open="https://github.com/A-Finch13/Poseidon-TCG/issues">Signaler un problème</a>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
