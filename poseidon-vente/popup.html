<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0b0d12; --panel:#141924; --panel2:#1a2030; --line:#252c3a; --txt:#e5e7eb; --mut:#8b93a3; --acc:#3b82f6; --bad:#ef4444; --ok:#22c55e; --sim:#eab308; }
  * { box-sizing:border-box; }
  body { margin:0; width:380px; background:var(--bg); color:var(--txt); font:13px/1.4 system-ui, "Segoe UI", sans-serif; }
  button, select, input { font:inherit; }
  .muted { color:var(--mut); }

  /* en-tête */
  header { display:flex; align-items:center; gap:8px; padding:12px 14px 10px; }
  header img { width:20px; height:20px; }
  header h1 { margin:0; font-size:14px; font-weight:700; flex:1; }
  header small { color:var(--mut); font-weight:400; margin-left:4px; }
  .pill { font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; border:1px solid var(--line); background:var(--panel); }
  .pill.off { color:var(--mut); } .pill.sim { color:var(--sim); border-color:#713f12; } .pill.real { color:var(--ok); border-color:#14532d; }

  /* commande principale */
  .control { padding:0 14px 12px; display:grid; grid-template-columns:1fr auto; gap:8px; }
  .main { border:0; border-radius:10px; padding:10px; font-weight:750; font-size:14px; color:#fff; cursor:pointer; letter-spacing:.3px; }
  .main.start { background:#16a34a; } .main.stop { background:#b91c1c; }
  .main:hover { filter:brightness(1.1); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; background:var(--panel); }
  .seg button { border:0; background:transparent; color:var(--mut); padding:0 12px; cursor:pointer; font-weight:550; }
  .seg button.on.sim { background:#3a2e0b; color:var(--sim); } .seg button.on.real { background:#0f3320; color:var(--ok); }

  /* état en direct */
  .live { margin:0 14px 12px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .phase { display:flex; align-items:center; gap:7px; font-weight:600; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--mut); flex:none; }
  .dot.run { background:var(--ok); box-shadow:0 0 0 3px rgba(34,197,94,.18); }
  .dot.err { background:var(--bad); }
  .bar { height:4px; background:var(--panel2); border-radius:4px; margin-top:8px; overflow:hidden; }
  .bar i { display:block; height:100%; background:var(--acc); width:0; transition:width .4s; }
  .bar-lab { font-size:11px; color:var(--mut); margin-top:3px; }
  .kpis { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:10px; }
  .kpi { background:var(--panel2); border-radius:8px; padding:6px 8px; }
  .kpi b { display:block; font-size:16px; font-variant-numeric:tabular-nums; }
  .kpi span { font-size:10.5px; color:var(--mut); }
  .msg { margin-top:8px; font-size:12px; border-radius:8px; padding:6px 8px; }
  .msg.err { background:rgba(239,68,68,.12); color:#fca5a5; }
  .msg.idle { background:rgba(234,179,8,.10); color:#fde68a; }

  /* onglets */
  .tabs { display:flex; border-bottom:1px solid var(--line); padding:0 14px; gap:4px; }
  .tabs button { background:none; border:0; color:var(--mut); padding:8px 10px; cursor:pointer; border-bottom:2px solid transparent; font-weight:550; }
  .tabs button.on { color:var(--txt); border-bottom-color:var(--acc); }
  .pane { padding:12px 14px 14px; }
  .pane[hidden] { display:none; }
  h3 { margin:0 0 6px; font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--mut); font-weight:650; display:flex; align-items:center; }
  h3 .sp { flex:1; }
  .block + .block { margin-top:14px; }

  /* activité */
  .scroll { max-height:170px; overflow:auto; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  td { padding:3px 4px; border-bottom:1px solid var(--line); white-space:nowrap; }
  td.n { white-space:normal; } td.r { text-align:right; font-variant-numeric:tabular-nums; }
  .log div { padding:4px 0; border-bottom:1px solid var(--line); font-size:12px; }
  .log time { color:var(--mut); margin-right:6px; font-variant-numeric:tabular-nums; }
  .k-sold { color:var(--ok); } .k-error { color:#fca5a5; } .k-sim { color:var(--sim); } .k-skip { color:var(--mut); }
  .R-N { color:#cbd5e1; } .R-R { color:#60a5fa; } .R-SR { color:#c084fc; }
  .link { background:none; border:0; color:var(--mut); cursor:pointer; font-size:11px; padding:0; }
  .link:hover { color:var(--txt); }

  /* réglages */
  .rar { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:6px 10px; }
  .rar label { display:flex; align-items:center; gap:7px; cursor:pointer; }
  .rar input[type=checkbox] { width:15px; height:15px; margin:0; accent-color:var(--acc); }
  .rar .hint { font-size:11px; color:var(--mut); }
  .num { display:flex; align-items:center; gap:4px; }
  .num input { width:62px; text-align:right; }
  input[type=number], select { background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:7px; padding:5px 7px; }
  input:disabled { opacity:.4; }
  .row { display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .row + .row { margin-top:8px; }
  select { width:100%; }
  .est { font-size:11px; color:var(--mut); margin-top:6px; }

  /* actions */
  .acts { display:grid; gap:8px; }
  .act { display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:10px; padding:9px 11px; cursor:pointer; }
  .act:hover { background:var(--panel2); }
  .act .ic { font-size:16px; width:20px; text-align:center; }
  .act b { display:block; font-weight:600; }
  .act span { font-size:11.5px; color:var(--mut); }
  .act.danger { border-color:#5b1a1a; }
  .act.danger b { color:#fca5a5; }
  .act.armed { background:#3b1111; }
</style>
</head>
<body>
<header>
  <img src="icons/icon48.png" alt="">
  <h1>Vente auto Poseidon<small id="ver"></small></h1>
  <span id="modePill" class="pill off">Arrêtée</span>
</header>

<div class="control">
  <button id="mainBtn" class="main start">▶ Démarrer</button>
  <div class="seg" role="radiogroup" aria-label="Mode">
    <button id="mSim" class="sim" title="Ne vend et ne retire rien : montre seulement ce qui serait fait">Simulation</button>
    <button id="mReal" class="real" title="Vend et retire pour de vrai">Réel</button>
  </div>
</div>

<div class="live">
  <div class="phase"><span id="dot" class="dot"></span><span id="phase">–</span></div>
  <div id="progress" hidden><div class="bar"><i id="barFill"></i></div><div class="bar-lab" id="barLab"></div></div>
  <div class="kpis">
    <div class="kpi"><b id="open">–</b><span>ventes en cours</span></div>
    <div class="kpi"><b id="wanted">–</b><span id="wantedLab">doubles recherchés</span></div>
    <div class="kpi"><b id="nextRot">–</b><span>prochaine rotation</span></div>
  </div>
  <div id="err" class="msg err" hidden></div>
  <div id="idle" class="msg idle" hidden></div>
</div>

<nav class="tabs">
  <button data-t="activity" class="on">Activité</button>
  <button data-t="settings">Réglages</button>
  <button data-t="actions">Actions</button>
</nav>

<!-- ACTIVITÉ -->
<section class="pane" id="p-activity">
  <div class="block" id="planBox" hidden>
    <h3 id="planTitle">Dernière simulation</h3>
    <div class="scroll"><table id="plan"></table></div>
  </div>
  <div class="block">
    <h3>Journal <span class="sp"></span><button id="clearLog" class="link">Effacer</button></h3>
    <div id="log" class="log scroll"></div>
  </div>
</section>

<!-- RÉGLAGES -->
<section class="pane" id="p-settings" hidden>
  <div class="block">
    <h3>Raretés à vendre et prix plancher</h3>
    <div class="rar">
      <label><input type="checkbox" id="rN"> <span class="R-N">Commune</span></label><span class="hint"></span>
      <div class="num"><input type="number" id="fN" min="1"> P</div>
      <label><input type="checkbox" id="rR"> <span class="R-R">Rare</span></label><span class="hint"></span>
      <div class="num"><input type="number" id="fR" min="1"> P</div>
      <label><input type="checkbox" id="rSR"> <span class="R-SR">Épique</span></label><span class="hint">en dernier</span>
      <div class="num"><input type="number" id="fSR" min="1"> P</div>
    </div>
  </div>
  <div class="block">
    <h3>Emplacements</h3>
    <div class="row"><span>Ventes en même temps (max)</span><div class="num"><input type="number" id="maxSlots" min="1" max="50"></div></div>
  </div>
  <div class="block">
    <h3>Vitesse</h3>
    <div class="row" style="display:block">
      <select id="readDelay" aria-label="Vitesse des lectures">
        <option value="3000">Lectures : Prudent (1 toutes les 3 s)</option>
        <option value="1200">Lectures : Normal (1 toutes les 1,2 s)</option>
        <option value="600">Lectures : Rapide (1 toutes les 0,6 s)</option>
        <option value="300">Lectures : Très rapide (1 toutes les 0,3 s)</option>
      </select>
    </div>
    <div class="row"><span>Ventes + retraits max / 30 s</span><div class="num"><input type="number" id="writeMax" min="1" max="29"></div></div>
    <div class="est" id="estimate"></div>
  </div>
</section>

<!-- ACTIONS -->
<section class="pane" id="p-actions" hidden>
  <div class="acts">
    <button class="act" id="stats"><span class="ic">📊</span><div><b>Statistiques</b><span>Argent rapporté, collection, historique</span></div></button>
    <button class="act" id="rotate"><span class="ic">🔄</span><div><b>Cycle complet maintenant</b><span>Retire tout puis remet en vente</span></div></button>
    <button class="act" id="rescan"><span class="ic">🗂️</span><div><b>Refaire l'inventaire</b><span>Relit toute la collection</span></div></button>
    <button class="act danger" id="withdraw"><span class="ic">⛔</span><div><b id="withdrawLab">Tout retirer et arrêter</b><span>Retire toutes les ventes à prix fixe (2 clics)</span></div></button>
  </div>
</section>

<script src="popup.js"></script>
</body>
</html>
