<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<style>
  :root { --bg:#0b0d12; --panel:#151922; --line:#262c38; --txt:#e5e7eb; --mut:#8b93a3; --acc:#3b82f6; --bad:#ef4444; --ok:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; width:360px; background:var(--bg); color:var(--txt); font:13px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { padding:14px 16px 10px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  header img { width:24px; height:24px; }
  header h1 { font-size:14px; margin:0; font-weight:650; letter-spacing:.2px; }
  section { padding:12px 16px; border-bottom:1px solid var(--line); }
  label { display:block; color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.5px; margin:0 0 4px; }
  input, select { width:100%; background:var(--panel); border:1px solid var(--line); color:var(--txt); border-radius:8px; padding:7px 9px; font:inherit; }
  input:focus, select:focus { outline:none; border-color:var(--acc); }
  .row { display:flex; gap:8px; margin-top:8px; }
  .row > * { flex:1; }
  .chk { display:flex; align-items:center; gap:6px; margin-top:8px; color:var(--mut); }
  .chk input { width:auto; }
  button { background:var(--acc); color:white; border:0; border-radius:8px; padding:8px 10px; font:inherit; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--txt); font-weight:500; }
  button:hover { filter:brightness(1.1); }
  ul { list-style:none; margin:0; padding:0; max-height:220px; overflow:auto; }
  li { display:flex; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); }
  li:last-child { border-bottom:0; }
  li .name { flex:1; min-width:0; }
  li .name b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  li .name small { color:var(--mut); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--line); flex:none; }
  .dot.on { background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .x { background:transparent; color:var(--mut); padding:2px 6px; font-size:16px; }
  .x:hover { color:var(--bad); }
  .empty { color:var(--mut); text-align:center; padding:10px 0; }
  footer { padding:10px 16px 14px; display:flex; gap:8px; align-items:center; }
  footer select { width:auto; flex:none; }
  #status { color:var(--mut); font-size:12px; flex:1; }
  #status.err { color:var(--bad); }
  #status a { color:var(--acc); }
</style>
</head>
<body>
<header><img src="icons/icon48.png" alt=""><h1>Alertes Marché Poseidon</h1></header>

<section>
  <form id="add">
    <label for="name">Carte à surveiller</label>
    <input id="name" list="sugg" placeholder="ex : Rosa Runcandel" autocomplete="off" required>
    <datalist id="sugg"></datalist>
    <div class="row">
      <div>
        <label for="max">Prix max (perles)</label>
        <input id="max" type="number" min="1" placeholder="aucun">
      </div>
      <div>
        <label for="rar">Rareté</label>
        <select id="rar">
          <option value="">Toutes</option>
          <option value="N">Commune</option><option value="R">Rare</option>
          <option value="SR">Épique</option><option value="SSR">Légendaire</option>
          <option value="UR">Mythique</option><option value="SEC">Secrète</option>
        </select>
      </div>
    </div>
    <label class="chk"><input id="exact" type="checkbox" checked> Nom exact (décocher = contient le texte)</label>
    <div class="row"><button type="submit">Ajouter à ma liste</button></div>
  </form>
</section>

<section>
  <label>Ma liste</label>
  <ul id="list"></ul>
</section>

<footer>
  <div id="status">—</div>
  <select id="interval" title="Fréquence de vérification">
    <option value="2">2 s</option><option value="3">3 s</option>
    <option value="5">5 s</option><option value="10">10 s</option>
    <option value="15">15 s</option><option value="30">30 s</option>
    <option value="60">1 min</option>
  </select>
  <button class="ghost" id="now">Vérifier</button>
</footer>

<script src="popup.js"></script>
</body>
</html>
