name: Release Aquaman

# Publie une release à chaque nouvelle version d'Aquaman perso arrivée sur main :
# lit la version de aquaman-perso/manifest.json et, si la release "aquaman-vX.Y.Z" n'existe pas encore,
# crée le tag, zippe le dossier aquaman-perso et attache le zip. Rien à faire à la main.
on:
  push:
    branches: [main]
    paths: ['aquaman-perso/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lire la version
        id: ver
        run: echo "version=$(jq -r .version aquaman-perso/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Release déjà publiée ?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "aquaman-v${{ steps.ver.outputs.version }}" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "La version ${{ steps.ver.outputs.version }} est déjà publiée : rien à faire."
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire le zip
        if: steps.exists.outputs.found == 'false'
        run: |
          cd aquaman-perso
          zip -r "../aquaman-perso-${{ steps.ver.outputs.version }}.zip" . -x '.*'
          cp "../aquaman-perso-${{ steps.ver.outputs.version }}.zip" ../aquaman-perso.zip

      - name: Publier la release
        if: steps.exists.outputs.found == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "aquaman-v${{ steps.ver.outputs.version }}" "aquaman-perso-${{ steps.ver.outputs.version }}.zip" aquaman-perso.zip \
            --target "$GITHUB_SHA" \
            --title "Aquaman perso ${{ steps.ver.outputs.version }}" \
            --notes "Dézippe dans le dossier de l'extension (en remplaçant les fichiers), puis clique sur ↻ sous Aquaman dans chrome://extensions. Avec Git : git pull, puis ↻."
