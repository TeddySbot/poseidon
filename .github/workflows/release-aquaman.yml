name: Release Aquaman

# Publie une release quand un tag "aquaman-vX.Y.Z" est poussé : vérifie que la version du manifest correspond,
# zippe le dossier aquaman-perso et attache le zip à la release.
on:
  push:
    tags:
      - 'aquaman-v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier la version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME#aquaman-v}"
          MANIFEST=$(jq -r .version aquaman-perso/manifest.json)
          if [ "$TAG" != "$MANIFEST" ]; then
            echo "::error::Le tag ($TAG) ne correspond pas à aquaman-perso/manifest.json ($MANIFEST)."
            exit 1
          fi
          echo "version=$MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Construire le zip
        run: |
          cd aquaman-perso
          zip -r "../aquaman-perso-${{ steps.ver.outputs.version }}.zip" . -x '.*'

      - name: Publier la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "aquaman-perso-${{ steps.ver.outputs.version }}.zip" \
            --title "Aquaman perso ${{ steps.ver.outputs.version }}" \
            --notes "Dézippe dans le dossier de l'extension (en remplaçant les fichiers), puis clique sur ↻ sous Aquaman dans chrome://extensions. Avec Git : git pull, puis ↻."
